<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Win11 Web OS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="desktop">
    <header class="top-note">Win11 Web OS (functional mini operating environment)</header>

    <main class="windows-grid" aria-label="Desktop apps">
      <button class="app-card" data-app="browser">🌐<span>Browser</span></button>
      <button class="app-card" data-app="notepad">📝<span>Notepad</span></button>
      <button class="app-card" data-app="m365">📊<span>Microsoft 365</span></button>
      <button class="app-card" data-app="explorer">📁<span>File Explorer</span></button>
      <button class="app-card" data-app="store">🛍️<span>Microsoft Store</span></button>
      <button class="app-card" data-app="calculator">🧮<span>Calculator</span></button>
      <button class="app-card" data-app="paint">🎨<span>Paint</span></button>
      <button class="app-card" data-app="todo">✅<span>Tasks</span></button>
      <button class="app-card" data-app="tic">❌<span>Tic-Tac-Toe</span></button>
      <button class="app-card" data-app="snake">🐍<span>Snake</span></button>
    </main>

    <section class="window" id="appWindow" hidden>
      <header class="window-bar">
        <strong id="windowTitle">App</strong>
        <div class="window-actions">
          <button id="minWindow" aria-label="Minimize window">—</button>
          <button id="closeWindow" aria-label="Close window">✕</button>
        </div>
      </header>
      <div class="window-body" id="windowBody"></div>
    </section>

    <footer class="taskbar">
      <button class="start-button" id="startButton">⊞ Start</button>
      <div class="taskbar-status">
        <span id="networkStatus">Online: checking...</span>
        <span class="clock" id="clock"></span>
      </div>
    </footer>

    <aside class="start-menu" id="startMenu" hidden>
      <h3>All apps</h3>
      <div class="start-apps">
        <button class="mini-app" data-app="browser">Browser</button>
        <button class="mini-app" data-app="notepad">Notepad</button>
        <button class="mini-app" data-app="m365">Microsoft 365</button>
        <button class="mini-app" data-app="explorer">File Explorer</button>
        <button class="mini-app" data-app="store">Microsoft Store</button>
        <button class="mini-app" data-app="calculator">Calculator</button>
        <button class="mini-app" data-app="paint">Paint</button>
        <button class="mini-app" data-app="todo">Tasks</button>
        <button class="mini-app" data-app="tic">Tic-Tac-Toe</button>
        <button class="mini-app" data-app="snake">Snake</button>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
